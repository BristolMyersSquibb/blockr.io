url: https://bristolmyerssquibb.github.io/blockr.io/
template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, news]
    right: [search, github]

reference:
- title: File I/O Blocks
  desc: Blocks for reading and writing various file formats
  contents:
  - new_read_block
  - new_write_block
  - new_download_block

- title: Format Registry
  desc: >
    Teach blockr.io a file format or a container -- a location holding
    several tables -- and build read expressions from what is registered.
  contents:
  - register_format
  - register_container
  - format_read_expr
  - container_read_expr
  - container_kinds
  - container_list_tables

- title: Declared Options
  desc: >
    An entry declares what it accepts, and blocks generate their settings
    fields from the answer.
  contents:
  - format_opt
  - format_options
  - source_options
  - member_options
  - format_options_ui
  - format_options_values
  - format_options_update

- title: Utilities
  desc: Helper functions for file handling and configuration
  contents:
  - gear_band_ui
  - file_category
  - file_extensions
  - file_policy
  - format_extension
  - new_data_dir_option
  - path_input
  - read_file_expr
  - resolve_data_dir
  - write_file_expr
  - write_formats
